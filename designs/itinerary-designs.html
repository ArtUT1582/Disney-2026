<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itinerary Design Options · Garcia Expedition 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Bebas+Neue&family=Tangerine:wght@700&family=Space+Grotesk:wght@400;500;700&family=Limelight&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0b10;color:#e8eaf0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ---------- chrome ---------- */
.bar{position:sticky;top:0;z-index:50;background:rgba(10,11,16,.93);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.1);padding:14px 20px}
.bar-in{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.bar h1{font-family:'Cinzel',serif;font-size:15px;letter-spacing:.14em;font-weight:700;color:#fbbf24;white-space:nowrap}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp .lab{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#8892a6;margin-right:4px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#cbd3e1;font:600 11.5px/1 'Plus Jakarta Sans',sans-serif;cursor:pointer;letter-spacing:.04em;transition:.15s}
.chip:hover{border-color:rgba(251,191,36,.5);color:#fff}
.chip[aria-pressed="true"]{background:#fbbf24;border-color:#fbbf24;color:#141005}
.hint{font-size:11.5px;color:#7d8798;margin-left:auto}
.stage{max-width:1400px;margin:0 auto;padding:26px 20px 80px}
.plate{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8892a6;margin:0 0 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.plate b{color:#fbbf24;font-weight:700}

/* =========================================================
   Shared semantic shell. Every design restyles the SAME DOM.
   ========================================================= */
.itin{--pad:34px;border-radius:18px;overflow:hidden;position:relative}
.itin .eyebrow,.itin .sub{letter-spacing:.24em;text-transform:uppercase;font-size:10.5px}
.itin .park{line-height:.95}
.itin .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px}
.itin .fact{padding:12px 14px}
.itin .fact-l{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.62}
.itin .fact-v{font-size:14px;font-weight:700;margin-top:3px}
.itin .cols{display:grid;gap:26px}
@media(min-width:900px){.itin .cols{grid-template-columns:1fr 1fr}}
.itin .col-label{font-size:10px;letter-spacing:.24em;text-transform:uppercase;opacity:.66;margin-bottom:12px}
.itin ol{list-style:none}
.itin .row{display:grid;grid-template-columns:74px 1fr;gap:14px;padding:11px 0;align-items:start}
.itin .time{font:700 11.5px/1.4 'JetBrains Mono',monospace;letter-spacing:.02em;padding-top:2px;white-space:nowrap}
.itin .title{font-weight:600;font-size:14px;line-height:1.38}
.itin .note{font-size:12.2px;line-height:1.55;opacity:.76;margin-top:4px}
.itin .extras{display:grid;gap:8px;margin-top:8px}
.itin .xrow{display:flex;gap:10px;align-items:baseline;font-size:12.5px}
.itin .xrow b{font-size:12.5px}

/* ===== 1 · BOARDING PASS ================================= */
[data-d="pass"] .itin{background:#f4f1e8;color:#1a1c22;border-radius:12px;
  font-family:'JetBrains Mono',monospace;
  background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.03) 6px 7px)}
[data-d="pass"] .head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
  padding:var(--pad);border-bottom:2px dashed #b9b2a0;flex-wrap:wrap}
[data-d="pass"] .park{font-family:'Bebas Neue',sans-serif;font-size:clamp(34px,5.4vw,62px);letter-spacing:.02em}
[data-d="pass"] .eyebrow{color:#a1591f;font-weight:700}
[data-d="pass"] .stub{border-left:2px dashed #b9b2a0;padding-left:18px;text-align:right;font-size:11px}
[data-d="pass"] .stub .big{font-family:'Bebas Neue',sans-serif;font-size:30px;color:#a1591f;line-height:1}
[data-d="pass"] .barcode{height:44px;margin-top:10px;
  background:repeating-linear-gradient(90deg,#1a1c22 0 2px,transparent 2px 4px,#1a1c22 4px 5px,transparent 5px 9px)}
[data-d="pass"] .facts{border-bottom:2px dashed #b9b2a0;background:#ded8c8}
[data-d="pass"] .fact{background:#f4f1e8}
[data-d="pass"] .body{padding:var(--pad)}
[data-d="pass"] .row{border-bottom:1px dotted #c3bcaa}
[data-d="pass"] .time{color:#a1591f}
[data-d="pass"] .col-label{color:#a1591f;font-weight:700}

/* ===== 2 · SWISS TIMETABLE =============================== */
[data-d="swiss"] .itin{background:#fff;color:#111;border-radius:0;font-family:'Space Grotesk',sans-serif}
[data-d="swiss"] .head{padding:var(--pad);border-bottom:4px solid #111}
[data-d="swiss"] .eyebrow{color:#d61f26;font-weight:700}
[data-d="swiss"] .park{font-size:clamp(38px,6.6vw,84px);font-weight:700;letter-spacing:-.035em;margin:6px 0}
[data-d="swiss"] .sub{color:#666}
[data-d="swiss"] .facts{gap:0;border-bottom:1px solid #111}
[data-d="swiss"] .fact{border-right:1px solid #ddd}
[data-d="swiss"] .fact-v{color:#d61f26}
[data-d="swiss"] .body{padding:var(--pad)}
[data-d="swiss"] .col-label{color:#d61f26;font-weight:700;border-bottom:2px solid #111;padding-bottom:6px}
[data-d="swiss"] .row{grid-template-columns:88px 1fr;border-bottom:1px solid #e6e6e6;padding:13px 0}
[data-d="swiss"] .time{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700}
[data-d="swiss"] .note{opacity:.68}

/* ===== 3 · FIELD JOURNAL ================================= */
[data-d="journal"] .itin{background:#efe6d2;color:#33291b;
  background-image:radial-gradient(circle at 20% 30%,rgba(150,120,70,.10),transparent 45%),
                   radial-gradient(circle at 80% 70%,rgba(120,90,50,.10),transparent 45%)}
[data-d="journal"] .head{padding:var(--pad);text-align:center;border-bottom:1px solid #c3b391}
[data-d="journal"] .eyebrow{font-family:'JetBrains Mono',monospace;color:#7a6034}
[data-d="journal"] .park{font-family:'Tangerine',cursive;font-size:clamp(58px,9vw,116px);font-weight:700;color:#4a3a22;line-height:.9;margin:4px 0}
[data-d="journal"] .sub{font-family:'Cormorant Garamond',serif;font-style:italic;text-transform:none;letter-spacing:.04em;font-size:15px;color:#7a6034}
[data-d="journal"] .facts{background:#c3b391}
[data-d="journal"] .fact{background:#efe6d2}
[data-d="journal"] .body{padding:var(--pad)}
[data-d="journal"] .col-label{font-family:'Tangerine',cursive;font-size:30px;letter-spacing:0;text-transform:none;color:#7a6034;opacity:1}
[data-d="journal"] .row{border-bottom:1px dashed #c3b391}
[data-d="journal"] .time{color:#8a5a2b}
[data-d="journal"] .title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700}
[data-d="journal"] .note{font-family:'Cormorant Garamond',serif;font-size:14.5px;opacity:.85}

/* ===== 4 · NEON MARQUEE ================================== */
[data-d="neon"] .itin{background:#0b0713;color:#f3e9ff;border:1px solid rgba(255,0,190,.3)}
[data-d="neon"] .head{padding:var(--pad);text-align:center;
  background:radial-gradient(120% 90% at 50% 0%,rgba(255,0,190,.20),transparent 70%)}
[data-d="neon"] .eyebrow{color:#31e8ff;text-shadow:0 0 10px rgba(49,232,255,.85)}
[data-d="neon"] .park{font-family:'Limelight',serif;font-size:clamp(32px,5.6vw,68px);color:#fff;
  text-shadow:0 0 6px #ff4fd8,0 0 22px #ff00be,0 0 48px rgba(255,0,190,.55);margin:10px 0}
[data-d="neon"] .sub{color:#b98fd8}
[data-d="neon"] .facts{background:rgba(255,255,255,.10)}
[data-d="neon"] .fact{background:#120c1e}
[data-d="neon"] .fact-v{color:#31e8ff;text-shadow:0 0 10px rgba(49,232,255,.6)}
[data-d="neon"] .body{padding:var(--pad)}
[data-d="neon"] .col-label{color:#ff4fd8;text-shadow:0 0 10px rgba(255,79,216,.7)}
[data-d="neon"] .row{border-bottom:1px solid rgba(255,79,216,.16)}
[data-d="neon"] .time{color:#31e8ff}
[data-d="neon"] .note{color:#c9b3dd;opacity:.8}

/* ===== 5 · EDITORIAL ===================================== */
[data-d="editorial"] .itin{background:#faf8f5;color:#16130f}
[data-d="editorial"] .head{padding:var(--pad) var(--pad) 22px;border-bottom:1px solid #ded7cc}
[data-d="editorial"] .eyebrow{color:#9a3412;font-weight:700}
[data-d="editorial"] .park{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(40px,7vw,92px);letter-spacing:-.03em;margin:8px 0}
[data-d="editorial"] .sub{font-family:'Cormorant Garamond',serif;font-style:italic;text-transform:none;letter-spacing:.02em;font-size:16px;color:#6b6157}
[data-d="editorial"] .facts{background:#ded7cc}
[data-d="editorial"] .fact{background:#faf8f5}
[data-d="editorial"] .fact-v{font-family:'Playfair Display',serif}
[data-d="editorial"] .body{padding:var(--pad);column-gap:44px}
[data-d="editorial"] .col-label{font-family:'Playfair Display',serif;font-size:13px;letter-spacing:.16em;color:#9a3412;border-bottom:2px solid #16130f;padding-bottom:8px}
[data-d="editorial"] .row{grid-template-columns:64px 1fr;border-bottom:1px solid #ebe5dc}
[data-d="editorial"] .title{font-family:'Playfair Display',serif;font-size:17px;font-weight:600}
[data-d="editorial"] .note{font-family:'Cormorant Garamond',serif;font-size:15px;opacity:.86}
[data-d="editorial"] .time{color:#9a3412}

/* ===== 6 · BLUEPRINT ===================================== */
[data-d="blueprint"] .itin{background:#0a2540;color:#cfe6ff;
  background-image:linear-gradient(rgba(120,190,255,.09) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(120,190,255,.09) 1px,transparent 1px);
  background-size:26px 26px;border:1px solid rgba(120,190,255,.3)}
[data-d="blueprint"] .head{padding:var(--pad);border-bottom:1px dashed rgba(120,190,255,.45)}
[data-d="blueprint"] .eyebrow,[data-d="blueprint"] .time,[data-d="blueprint"] .fact-l{font-family:'JetBrains Mono',monospace}
[data-d="blueprint"] .eyebrow{color:#7ec8ff}
[data-d="blueprint"] .park{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(26px,4.4vw,52px);letter-spacing:.04em;margin:8px 0;color:#fff}
[data-d="blueprint"] .sub{color:#8fb8dd}
[data-d="blueprint"] .facts{background:rgba(120,190,255,.28)}
[data-d="blueprint"] .fact{background:#0a2540}
[data-d="blueprint"] .fact-v{color:#7ec8ff;font-family:'JetBrains Mono',monospace}
[data-d="blueprint"] .body{padding:var(--pad)}
[data-d="blueprint"] .col-label{color:#7ec8ff;font-family:'JetBrains Mono',monospace}
[data-d="blueprint"] .row{border-bottom:1px dashed rgba(120,190,255,.22)}
[data-d="blueprint"] .title{font-family:'JetBrains Mono',monospace;font-size:13px}
[data-d="blueprint"] .note{color:#9dc3e6}

/* ===== 7 · VINTAGE POSTER =============================== */
[data-d="poster"] .itin{background:#1d4034;color:#f6e9c9;border:10px solid #e0b356}
[data-d="poster"] .head{padding:var(--pad);text-align:center;background:#16332a;border-bottom:5px solid #e0b356}
[data-d="poster"] .eyebrow{color:#e0b356;font-weight:700}
[data-d="poster"] .park{font-family:'Bebas Neue',sans-serif;font-size:clamp(44px,8vw,104px);color:#f0c674;letter-spacing:.03em;line-height:.9;margin:8px 0}
[data-d="poster"] .sub{color:#b8cbb3}
[data-d="poster"] .facts{background:#e0b356}
[data-d="poster"] .fact{background:#1d4034}
[data-d="poster"] .fact-l{color:#a8bfa3}
[data-d="poster"] .fact-v{color:#f0c674;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em}
[data-d="poster"] .body{padding:var(--pad)}
[data-d="poster"] .col-label{color:#e0b356;font-weight:700}
[data-d="poster"] .row{border-bottom:1px solid rgba(224,179,86,.28)}
[data-d="poster"] .time{color:#e0b356}
[data-d="poster"] .title{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.03em;font-weight:400}
[data-d="poster"] .note{color:#cddcc8;opacity:.85}

/* ===== 8 · TERMINAL ===================================== */
[data-d="terminal"] .itin{background:#04100a;color:#57ff8f;border:1px solid rgba(87,255,143,.32);
  font-family:'JetBrains Mono',monospace;border-radius:8px}
[data-d="terminal"] .head{padding:var(--pad);border-bottom:1px solid rgba(87,255,143,.28)}
[data-d="terminal"] .eyebrow{color:#2fd46f}
[data-d="terminal"] .park{font-size:clamp(22px,3.6vw,42px);font-weight:700;margin:8px 0;color:#b6ffcf;text-shadow:0 0 14px rgba(87,255,143,.4)}
[data-d="terminal"] .park::before{content:"$ ";color:#2fd46f}
[data-d="terminal"] .sub{color:#3f9c63}
[data-d="terminal"] .facts{background:rgba(87,255,143,.22)}
[data-d="terminal"] .fact{background:#04100a}
[data-d="terminal"] .fact-v{color:#b6ffcf}
[data-d="terminal"] .body{padding:var(--pad)}
[data-d="terminal"] .col-label{color:#2fd46f}
[data-d="terminal"] .col-label::before{content:"## "}
[data-d="terminal"] .row{border-bottom:1px dotted rgba(87,255,143,.18)}
[data-d="terminal"] .title{font-size:13px;color:#d8ffe6}
[data-d="terminal"] .title::before{content:"> ";color:#2fd46f}
[data-d="terminal"] .note{color:#4bbb78}

/* ===== 9 · STORYBOOK =================================== */
[data-d="storybook"] .itin{background:#120a1f;color:#f0e6d2;border:1px solid rgba(212,175,110,.4);
  background-image:radial-gradient(90% 60% at 50% 0%,rgba(212,175,110,.16),transparent 70%)}
[data-d="storybook"] .head{padding:var(--pad);text-align:center;border-bottom:1px solid rgba(212,175,110,.35)}
[data-d="storybook"] .eyebrow{color:#d4af6e}
[data-d="storybook"] .park{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(30px,5.2vw,66px);
  background:linear-gradient(180deg,#f7e3b0,#c9973f);-webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0}
[data-d="storybook"] .sub{color:#a08fbd}
[data-d="storybook"] .facts{background:rgba(212,175,110,.3)}
[data-d="storybook"] .fact{background:#150c24}
[data-d="storybook"] .fact-v{font-family:'Cinzel',serif;color:#e8c98a}
[data-d="storybook"] .body{padding:var(--pad)}
[data-d="storybook"] .col-label{font-family:'Cinzel',serif;color:#d4af6e;font-size:12px}
[data-d="storybook"] .row{border-bottom:1px solid rgba(212,175,110,.16)}
[data-d="storybook"] .time{color:#d4af6e}
[data-d="storybook"] .title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:#fdf6e6}
[data-d="storybook"] .note{font-family:'Cormorant Garamond',serif;font-size:15px;color:#c9bcd8}

/* ===== 10 · OPS DASHBOARD ============================== */
[data-d="ops"] .itin{background:#0e1117;color:#dbe3ef;border:1px solid rgba(255,255,255,.1)}
[data-d="ops"] .head{padding:24px var(--pad);display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(135deg,rgba(56,139,253,.14),transparent)}
[data-d="ops"] .eyebrow{color:#58a6ff}
[data-d="ops"] .park{font-size:clamp(24px,3.8vw,44px);font-weight:800;letter-spacing:-.025em;margin:6px 0}
[data-d="ops"] .sub{color:#7d8796}
[data-d="ops"] .facts{background:rgba(255,255,255,.08)}
[data-d="ops"] .fact{background:#0e1117}
[data-d="ops"] .fact-v{color:#58a6ff;font-family:'JetBrains Mono',monospace}
[data-d="ops"] .body{padding:var(--pad)}
[data-d="ops"] .col-label{color:#58a6ff}
[data-d="ops"] .row{grid-template-columns:78px 1fr;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:11px 13px;margin-bottom:7px;align-items:center}
[data-d="ops"] .time{color:#58a6ff;background:rgba(88,166,255,.13);border:1px solid rgba(88,166,255,.3);
  border-radius:6px;padding:4px 7px;text-align:center;font-size:10.5px}
[data-d="ops"] .note{opacity:.7}
[data-d="ops"] .tagchip{display:inline-block;margin-top:6px;font:700 9px/1 'JetBrains Mono',monospace;
  letter-spacing:.14em;text-transform:uppercase;padding:4px 7px;border-radius:5px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#9fb0c8}
.itin .tagchip{display:none}
[data-d="ops"] .itin .tagchip{display:inline-block}

@media print{.bar{display:none}body{background:#fff}}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <h1>ITINERARY DESIGN OPTIONS</h1>
    <div class="grp" id="dayPick"><span class="lab">Day</span></div>
    <div class="grp" id="designPick"><span class="lab">Design</span></div>
    <span class="hint">10 designs × 5 days · pick a combination</span>
  </div>
</div>

<div class="stage">
  <p class="plate" id="plate"></p>
  <div id="mount"></div>
</div>

ne"},{"time":"8:30PM","title":"Scare Zones · NY + Hollywood","note":"Walk-throughs, no line. Eat a snack. Peak fog ≈ 9:30p — best photos.","tag":"zone","kind":"none"}]},{"label":"MIDNIGHT · CLOSE","rows":[{"time":"9:00PM","title":"Houses #4 + #5","note":"Crowds peak now. Use single-rider lines if posted. Standby times in the app run ~20% high.","tag":"house","kind":"ride"},{"time":"10:30PM","title":"Bar break · Finnegan's or Duff","note":"Reset. Charge phone. Finnegan's (NY) for the live band; Duff Brewery (Springfield) for Flaming Moe.","tag":"bar","kind":"food"},{"time":"11:00PM","title":"Houses #6 + #7","note":"Lines drop sharply after 11. This is the window. Move fast.","tag":"house","kind":"ride"},{"time":"12:00AM","title":"House #8 · repeat favorite","note":"Wait times often under 20 min in the final hour. Hit the one you couldn't fully take in.","tag":"house","kind":"ride"},{"time":"12:30AM","title":"Chez Alcatraz · last drink","note":"San Francisco area. Sit. Watch the scare actors work the last shift.","tag":"bar","kind":"food"},{"time":"12:45AM","title":"Final scare-zone walk","note":"Photos at the front-gate icon statue. Last looks at the carnival before they kill the lights.","tag":"zone","kind":"none"},{"time":"1:00AM","title":"Park close · exit","note":"Restroom BEFORE leaving. Parking lot crawls — give it 15 min before fighting it.","tag":"travel","kind":"none"},{"time":"1:30AM","title":"On the road · Art of Animation","note":"Drive sober. Uber if needed. Sitter hand-off, then collapse. Friday is rest day.","tag":"travel","kind":"none"},{"time":"💀","title":"8 HOUSES · 5 ZONES · 1 NIGHT","note":"The Garcia adults survived the Infernal Carnival. Annelise slept through it all.","tag":"finale","kind":"none"}]}],"extras":{"houses":[{"rank":"01","name":"Newest IP House","why":"Longest line by 8p — hit first"},{"rank":"02","name":"Second Hyped IP","why":"Crowd hits by 8p"},{"rank":"03","name":"Universal Monsters","why":"Strong second wave"},{"rank":"04","nam eat views of the land. Probably Annelise's favorite of the day.","tag":"mario-yellow","kind":"ride"},{"time":"11:00AM","title":"Mine-Cart Madness (Express)","note":"Donkey Kong Country. Annelise rides ✅ (40\"). Innovative track design — feels like the cart is jumping rails.","tag":"mario","kind":"ride"},{"time":"11:30AM","title":"Power-Up Band activities","note":"Punch blocks. Hit key challenges. 3 keys unlocks Bowser Jr. Shadow Showdown — the secret level. Annelise will lose her mind.","tag":"mario-blue","kind":"none"},{"time":"12:00PM","title":"BAND HACK — pass them around","note":"You don't need a band per person. Annelise gets the most use — let her keep one strapped on all day.","tag":"prep","kind":"none"},{"time":"12:30PM","title":"Lunch · Toadstool Cafe","note":"Mario mushroom soup · Princess Peach cake. Photo-worthy food Annelise will actually eat.","tag":"food","kind":"food"}]},{"label":"AFTERNOON & NIGHT · PM","rows":[{"time":"1:30PM","title":"Curse of the Werewolf (Express)","note":"Family coaster but dark theming may be too much for Annelise. Rider Switch; adults swap rides while one stays with him.","tag":"dark","kind":"ride"},{"time":"2:15PM","title":"Monsters Unchained (Express)","note":"Trackless dark ride through Universal Monsters lore. Not for Annelise. Rider Switch. Stroller parking outside both rides.","tag":"dark","kind":"ride"},{"time":"3:00PM","title":"Hiccup's Wing Gliders (Express)","note":"Family coaster on Isle of Berk. Annelise rides ✅ (40\"). Smooth, scenic, perfect for her.","tag":"dragon","kind":"ride"},{"time":"3:30PM","title":"Dragon Racer's Rally · only if line < 30 min","note":"Only ride NOT on Express in the park. Hop in if it's short, otherwise skip — you've got bigger fish.","tag":"dragon","kind":"ride"},{"time":"4:00PM","title":"Meet Toothless","note":"Lines build fast. Either grab now or end of night when they die down.","tag":"dragon","kind":"none"},{"time":"4:30PM","title":"Battle at the Ministry (Express)","note":"The biggest headliner in the park. Annelise rides ✅ (40\"). Innovative ride system — moves through multiple show buildings.","tag":"magic","kind":"ride"},{"time":"5:30PM","title":"Butterbeer + Butterbeer ice cream","note":"Mandatory. Get the frozen version. Annelise's allowed — non-alcoholic. Skip the wand purchase; you've already spent on bands.","tag":"magic","kind":"food"},{"time":"6:30PM","title":"Dinner · Atlantic or Blue Dragon","note":"Both in Celestial Park. Sit-down, table service. You've earned it.","tag":"food","kind":"food"},{"time":"8:00PM","title":"Stardust Racers (Express) · Rider Switch","note":"Dueling coaster. Annelise can't ride (48\"; sshe's 42\"). Both adults ride both sides via swap. Reopened Mar 2026.","tag":"celestial","kind":"ride"},{"time":"8:30PM","title":"Stardust Show — Celestial Park","note":"Nighttime show. Check showtimes in app. Good wind-down before exit.","tag":"celestial","kind":"none"},{"time":"8:45PM","title":"One last walk through Nintendo World","note":"All five lands light up differently at night. Pipes glow. Characters move. Music plays. Pure magic for Annelise.","tag":"mario-blue","kind":"none"},{"time":"9:00PM","title":"Uber back to Art of Animation","note":"Don't push to close — you have a flight or drive home tomorrow. Pack tonight, sleep early.","tag":"break","kind":"none"},{"time":"🏆","title":"FIVE PARKS · ONE WEEK · TRIP COMPLETE","note":"The Garcia family conquered Orlando.","tag":"finale","kind":"none"}]}],"extras":{"houses":[],"worlds":[{"num":"LAND 01","name":"Super Nintendo World","tag":"Mario · DK"},{"num":"LAND 02","name":"Dark Universe","tag":"Monsters"},{"num":"LAND 03","name":"Isle of Berk","tag":"HtTYD"},{"num":"LAND 04","name":"Wizarding World","tag":"Ministry"},{"num":"LAND 05","name":"Celestial Park","tag":"Hub · Stardust"}],"budget":[]}}};

const DESIGNS = [
  ['pass',      '01 · Boarding Pass'],
  ['swiss',     '02 · Swiss Timetable'],
  ['journal',   '03 · Field Journal'],
  ['neon',      '04 · Neon Marquee'],
  ['editorial', '05 · Editorial'],
  ['blueprint', '06 · Blueprint'],
  ['poster',    '07 · Vintage Poster'],
  ['terminal',  '08 · Terminal'],
  ['storybook', '09 · Storybook'],
  ['ops',       '10 · Ops Dashboard'],
];
const DAYS = ['ak','hs','mk','hhn','eu'];

let curDay = 'ak', curDesign = 'pass';
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function extrasFor(d){
  const e = d.extras || {};
  if (e.houses && e.houses.length)
    return `<div class="extras">${e.houses.map(h=>
      `<div class="xrow"><b>${esc(h.rank)}</b><span><b>${esc(h.name)}</b> — ${esc(h.why)}</span></div>`).join('')}</div>`;
  if (e.worlds && e.worlds.length)
    return `<div class="extras">${e.worlds.map(w=>
      `<div class="xrow"><b>${esc(w.num)}</b><span><b>${esc(w.name)}</b> — ${esc(w.tag)}</span></div>`).join('')}</div>`;
  return '';
}

function render(){
  const d = DATA[curDay];
  document.body.setAttribute('data-d', curDesign);
  const label = (DESIGNS.find(x=>x[0]===curDesign)||[])[1] || '';
  document.getElementById('plate').innerHTML =
    `<b>${esc(label)}</b> <span>·</span> <span>${esc(d.day)} — ${esc(d.park)} · ${esc(d.date)}</span>`;

  const facts = d.facts.map(f=>
    `<div class="fact"><div class="fact-l">${esc(f.l)}</div><div class="fact-v">${esc(f.v)}</div></div>`).join('');

  const cols = d.columns.map(c=>`
    <div class="col">
      <div class="col-label">${esc(c.label)}</div>
      <ol>${c.rows.map(r=>`
        <li class="row">
          <span class="time">${esc(r.time)}</span>
          <span>
            <span class="title">${esc(r.title)}</span>
            ${r.note ? `<span class="note">${esc(r.note)}</span>` : ''}
            ${r.tag ? `<span class="tagchip">${esc(r.tag)}</span>` : ''}
          </span>
        </li>`).join('')}</ol>
    </div>`).join('');

  // the boarding pass carries a stub; everything else uses the plain header
  const stub = curDesign === 'pass'
    ? `<div class="stub"><div>${esc(d.day)}</div><div class="big">${esc(d.date.split('·').pop().trim())}</div>
       <div>${esc(d.facts[0] ? d.facts[0].v : '')}</div><div class="barcode"></div></div>` : '';

  document.getElementById('mount').innerHTML = `
    <div class="itin">
      <div class="head">
        <div>
          <div class="eyebrow">${esc(d.eyebrow || d.day)}</div>
          <div class="park">${d.lines.length ? d.lines.map(esc).join(' ') : esc(d.park)}</div>
          <div class="sub">${esc(d.sub || d.date)}</div>
        </div>
        ${stub}
      </div>
      <div class="facts">${facts}</div>
      <div class="body">
        <div class="cols">${cols}</div>
        ${extrasFor(d)}
      </div>
    </div>`;

  document.querySelectorAll('#dayPick .chip').forEach(b=>b.setAttribute('aria-pressed', b.dataset.k===curDay));
  document.querySelectorAll('#designPick .chip').forEach(b=>b.setAttribute('aria-pressed', b.dataset.k===curDesign));
}

const dayBar = document.getElementById('dayPick');
DAYS.forEach(k=>{
  const b=document.createElement('button');
  b.className='chip'; b.dataset.k=k; b.textContent=DATA[k].park;
  b.onclick=()=>{curDay=k;render()};
  dayBar.appendChild(b);
});
const dBar = document.getElementById('designPick');
DESIGNS.forEach(([k,label])=>{
  const b=document.createElement('button');
  b.className='chip'; b.dataset.k=k; b.textContent=label;
  b.onclick=()=>{curDesign=k;render()};
  dBar.appendChild(b);
});
render();

/* one runnable check: every design must render every day with all rows intact */
function selfTest(){
  const expect = Object.fromEntries(DAYS.map(k=>[k, DATA[k].columns.reduce((a,c)=>a+c.rows.length,0)]));
  const bad=[];
  for (const [dz] of DESIGNS) for (const k of DAYS){
    curDesign=dz; curDay=k; render();
    const got=document.querySelectorAll('#mount .row').length;
    if (got!==expect[k]) bad.push(dz+'/'+k+' expected '+expect[k]+' got '+got);
  }
  curDay='ak'; curDesign='pass'; render();
  return bad.length ? {ok:false,bad} : {ok:true,combos:DESIGNS.length*DAYS.length,rows:expect};
}
window.selfTest = selfTest;
</script>
