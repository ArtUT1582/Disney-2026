<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Song and Language Wow · Disney 2026</title>
<style>
@property --wc{syntax:'<color>';inherits:true;initial-value:#FF4FA3}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --bg:#06080B; --line:rgba(255,255,255,.12); --ink:#F4F0E6; --mute:#8E8878; --acc:#39B36A; --mint:#8FE3AE; --gold:#E9C46A;
  --serif:"Playfair Display","Bodoni MT",Didot,Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --hand:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  --script:"Segoe Script","Brush Script MT","Lucida Handwriting",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
button{font-family:inherit}
.ic{font-style:normal}
.flag{width:20px;height:13px;border-radius:2px;display:block;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================= gallery chrome ================= */
.top{position:sticky;top:0;z-index:50;background:rgba(6,8,11,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font:900 18px/1 var(--serif);white-space:nowrap}
.brand span{color:var(--mint)}
.pick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.pick button{flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 7px;border-radius:999px;border:1px solid var(--line);background:#0d1015;color:var(--mute);cursor:pointer;font:700 12px/1 var(--sans);min-height:40px}
.pick button b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#1a1f27;color:#fff;font:800 12px/1 var(--mono)}
.pick button[aria-current=true]{color:#fff;border-color:var(--mint);box-shadow:0 0 0 1px var(--mint),0 0 22px -6px var(--mint)}
.pick button[aria-current=true] b{background:var(--mint);color:#06210f}
.view{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.view button{border:0;background:none;color:var(--mute);padding:10px 14px;font:700 12px/1 var(--sans);cursor:pointer;min-height:40px}
.view button[aria-pressed=true]{background:#fff;color:#111}
.intro{max-width:1240px;margin:0 auto;padding:22px 16px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 20px;align-items:start}
.big-l{grid-row:span 3;font:900 86px/.8 var(--serif);background:linear-gradient(160deg,#fff,var(--mint) 60%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro h1{margin:0;font:900 clamp(24px,4vw,36px)/1.1 var(--serif);display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.badge{font:800 9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--gold);color:#2a1d00}
.pitch{margin:4px 0 0;color:#cfc9bc;font-size:14.5px;line-height:1.6;max-width:86ch}
.real{margin:4px 0 0;color:var(--mute);font-size:13px;line-height:1.55;max-width:86ch}
.real b{color:var(--mint)}
@media (max-width:640px){.big-l{font-size:58px}.intro{gap:4px 14px}}
.hint{max-width:1240px;margin:0 auto 10px;padding:0 16px;font:700 10px/1.4 var(--mono);letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.hint b{color:var(--gold)}
.wrap{display:flex;justify-content:center;padding:0 16px 30px}
.device{width:min(1180px,100%)}
.device.phone{width:414px;max-width:100%;padding:12px;border-radius:56px;background:linear-gradient(145deg,#2a2d33,#0c0d10);box-shadow:0 0 0 1px #3b3f46,0 40px 80px rgba(0,0,0,.6)}
.stage{container:stage/inline-size;position:relative;padding:14px;border-radius:26px;background:#05070A;border:1px solid var(--line)}
.device.phone .stage{height:800px;overflow-y:auto;border-radius:44px;border:0;padding:12px;scrollbar-width:none}
.nav{display:flex;justify-content:center;gap:12px;padding:0 16px 60px}
.nav button{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:#0d1015;color:#fff;font:700 13px/1 var(--sans);cursor:pointer}

/* ================= shared mock of the real title card ================= */
.hero{position:relative;height:560px;border-radius:24px;overflow:hidden;background:#080B0F;isolation:isolate}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 14%;transition:filter 1.6s ease}
.hero .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(4,7,10,.86),rgba(4,7,10,.5) 45%,rgba(4,7,10,.1) 80%)}
.hero.night .bg{filter:brightness(.36) saturate(1.35) contrast(1.1)}
.copy{position:absolute;left:44px;bottom:46px;z-index:3;max-width:min(520px,50%);transition:filter .22s,opacity .22s}
.copy.swap{filter:blur(10px);opacity:0}
.eye{margin:0 0 12px;font:800 11px/1.5 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--mint)}
.ttl{margin:0;font:900 clamp(40px,6.4cqw,74px)/.95 var(--serif);color:#FFFBF2;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.rule{display:block;width:64px;height:3px;border-radius:2px;background:var(--acc);margin:16px 0 0}
.dates{margin:14px 0 0;font:600 15px/1.5 var(--sans);color:#EDE7DA;max-width:34ch}
.parks{margin-top:14px;padding:14px;border-radius:20px;background:linear-gradient(180deg,#141822,#0E121A);border:1px solid var(--line)}
.p-hd{display:flex;gap:12px;align-items:center;margin:0 0 10px}
.p-hd b{font:800 10px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--mint)}
.p-hd span{font:600 10px/1 var(--mono);color:#96A1B8}
.p-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.p-row figure{margin:0;position:relative;height:86px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.p-row img{width:100%;height:100%;object-fit:cover}
.p-row figcaption{position:absolute;inset:auto 0 0;padding:16px 9px 7px;font:700 10.5px/1.2 var(--sans);background:linear-gradient(transparent,rgba(0,0,0,.85))}
.p-row figcaption b{display:block;font:800 9px/1 var(--mono);letter-spacing:.16em;color:var(--mint);margin-bottom:3px}
@container stage (max-width:520px){
  .hero{height:700px;border-radius:22px}
  .hero .shade{background:linear-gradient(180deg,rgba(4,7,10,.25),rgba(4,7,10,.35) 40%,rgba(4,7,10,.94) 92%)}
  .copy{left:22px;right:22px;bottom:30px;max-width:none}
  .ttl{font-size:46px}
  .dates{font-size:13.5px}
  .p-row{grid-template-columns:repeat(5,130px);overflow-x:auto;scrollbar-width:none}
}
.fx{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}

/* ================= A · Fireworks finale ================= */
.a-langs{position:absolute;top:22px;right:22px;z-index:5;display:flex;gap:10px}
.a-gem{--c:#FFD27A;width:78px;padding:10px 0 10px;border-radius:18px;cursor:pointer;color:#fff;background:rgba(8,10,16,.55);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);display:grid;justify-items:center;gap:4px;transition:transform .25s,box-shadow .25s,border-color .25s}
.a-gem::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);opacity:.35;margin-bottom:2px}
.a-gem span{font:800 15px/1 var(--sans);letter-spacing:.08em}
.a-gem small{font:600 10px/1 var(--sans);opacity:.75}
.a-gem[aria-pressed=true]{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 30px -4px var(--c);transform:translateY(-2px)}
.a-gem[aria-pressed=true]::before{opacity:1}
.a-es{--c:#FF7AC0}.a-fr{--c:#7FD8FF}
.a-launch{position:absolute;right:26px;bottom:30px;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 24px 10px 10px;border-radius:999px;cursor:pointer;color:#fff;text-align:left;background:rgba(8,10,16,.62);border:1px solid rgba(255,210,122,.55);backdrop-filter:blur(10px);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.a-core{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:#2a1600;background:radial-gradient(circle at 40% 35%,#FFF4D2,#FFC24D 55%,#E07A1F);box-shadow:0 0 calc(18px + var(--lvl,0)*50px) rgba(255,190,80,.85)}
.a-core::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:2px solid rgba(255,210,122,.75);animation:ring 1.8s ease-out infinite}
.playing .a-core::after{animation:none;opacity:0}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.5);opacity:0}}
.a-txt b{display:block;font:800 17px/1.2 var(--sans)}
.a-txt small{font:600 11.5px/1 var(--sans);color:var(--gold)}
@container stage (max-width:520px){
  .a-langs{left:14px;right:14px;justify-content:center}
  .a-launch{left:16px;right:16px;bottom:18px}
  .A .copy{bottom:122px}
}

/* ================= B · Departure board ================= */
.b-board{--cw:23px;--ch:34px;--fs:20px;margin:0 0 14px;padding:14px 18px 16px;border-radius:18px;background:linear-gradient(180deg,#25282e,#131518);border:1px solid #34373d;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 40px rgba(0,0,0,.45)}
.b-cap{display:flex;justify-content:space-between;gap:10px;font:800 10px/1 var(--mono);letter-spacing:.26em;color:#9a9486;margin-bottom:12px}
.b-cap i{font-style:normal;color:var(--gold)}
.b-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.b-row+.b-row{margin-top:10px}
.b-cells{display:inline-flex;gap:3px}
.fl{display:inline-grid;place-items:center;width:var(--cw);height:var(--ch);border-radius:4px;color:#F7EBCB;font:800 var(--fs)/1 var(--mono);background:linear-gradient(180deg,#2c2c2c,#1a1a1a 49%,#050505 49%,#050505 51%,#171717 51%,#0e0e0e);box-shadow:0 2px 3px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07)}
.fl b{display:block}
.fl.go b{animation:flap .055s linear}
@keyframes flap{from{transform:scaleY(.1);filter:brightness(1.9)}}
.b-lab .fl{color:var(--gold)}
.b-btn{margin-left:auto;display:inline-flex;align-items:center;gap:10px;height:var(--ch);padding:0 18px;border-radius:6px;cursor:pointer;color:#111;background:linear-gradient(#F7EBCB,#d9caa3);border:0;font:800 15px/1 var(--mono);box-shadow:0 3px 0 #8f8466}
.b-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8f8466}
.b-lamp,.b-lk i{width:9px;height:9px;border-radius:50%;background:#3a3a3a;box-shadow:inset 0 1px 2px #000}
.playing .b-lamp{background:#5CFF8F;box-shadow:0 0 10px #5CFF8F;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.b-langs{display:inline-flex;gap:8px}
.b-lk{--cw:20px;--ch:30px;--fs:17px;display:inline-flex;align-items:center;gap:6px;padding:4px 7px 4px 4px;border-radius:8px;background:#0b0c0e;border:1px solid #2c2f35;cursor:pointer}
.b-lk[aria-pressed=true]{border-color:var(--gold)}
.b-lk[aria-pressed=true] i{background:#FFB341;box-shadow:0 0 10px #FFB341}
.B .ttl span,.B .eye span{display:inline-block}
.B .ttl span.go,.B .eye span.go{animation:flapBig .06s linear}
@keyframes flapBig{from{transform:scaleY(.1);opacity:.5}}
@container stage (max-width:520px){
  .b-board{--cw:15px;--ch:24px;--fs:13.5px;padding:12px}
  .b-lk{--cw:15px;--ch:24px;--fs:13px}
  .b-art{display:none}
  .b-row{gap:8px}
  .b-lab{width:100%}
  .b-btn{padding:0 10px}
  .b-cap span{display:none}
}

/* ================= C · Dynamic Island ================= */
.c-isl{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:6;width:264px;height:46px;border-radius:24px;background:#000;box-shadow:0 14px 36px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);overflow:hidden;cursor:pointer;transition:width .6s cubic-bezier(.3,1.45,.45,1),height .6s cubic-bezier(.3,1.45,.45,1),border-radius .5s}
.c-isl.open{width:min(440px,calc(100% - 28px));height:252px;border-radius:38px;cursor:default}
.c-mini{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:0 9px 0 7px;transition:opacity .2s}
.c-isl.open .c-mini{opacity:0;pointer-events:none}
.c-art{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:55% 30%;animation:spin 6s linear infinite paused}
.playing .c-art{animation-play-state:running}
.c-mt{flex:1;min-width:0;font:700 12.5px/1 var(--sans);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.on{display:none}.playing .on{display:inline}.playing .off{display:none}
.c-wave{display:flex;align-items:center;gap:2.5px;height:22px}
.c-wave i{width:3px;height:22px;border-radius:2px;background:var(--mint);transform:scaleY(.15)}
.c-code{font:800 10px/1 var(--mono);letter-spacing:.08em;color:#000;background:#fff;border-radius:999px;padding:5px 7px}
.c-full{position:absolute;left:0;right:0;top:0;padding:22px 22px 20px;opacity:0;transform:scale(.9);transform-origin:top center;transition:opacity .2s,transform .45s cubic-bezier(.3,1.4,.45,1);pointer-events:none}
.c-isl.open .c-full{opacity:1;transform:none;pointer-events:auto;transition-delay:.12s}
.c-top{display:flex;align-items:center;gap:14px}
.c-art2{width:62px;height:62px;border-radius:16px;object-fit:cover;object-position:55% 25%}
.c-meta{flex:1;min-width:0}
.c-meta b{display:block;font:800 19px/1.15 var(--sans);color:#fff}
.c-meta small{font:600 12px/1.3 var(--sans);color:#9aa0aa}
.c-play{width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:#000;font-size:17px;cursor:pointer;flex:none}
.c-scrub{display:flex;align-items:center;gap:10px;margin:16px 0;font:600 11px/1 var(--mono);color:#9aa0aa}
.c-scrub input{flex:1;accent-color:var(--mint)}
.c-seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:16px;background:#1a1c20}
.c-seg button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 2px;border:0;background:none;color:#c8ccd2;font:700 12.5px/1 var(--sans);cursor:pointer;transition:color .3s}
.c-seg button[aria-pressed=true]{color:#000}
.c-pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:12px;background:#fff;transition:transform .5s cubic-bezier(.3,1.5,.45,1);transform:translateX(calc(var(--i,0)*100%))}
.c-hintx{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:5;font:700 10px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:#fff;opacity:.75;text-shadow:0 1px 4px #000;pointer-events:none;transition:opacity .3s;white-space:nowrap}
.c-isl.open~.c-hintx{opacity:0}

/* ================= D · Turntable ================= */
.d-wrap{position:absolute;right:4%;top:50%;width:min(44%,470px);transform:translateY(-50%);perspective:1500px;z-index:4}
.d-tt{container-type:inline-size;position:relative;aspect-ratio:1/.84;border-radius:3.5cqw;transform:rotateX(24deg) rotateZ(-7deg);background:linear-gradient(135deg,#6e4223,#3b2212 60%,#2a170b);box-shadow:0 4cqw 7cqw rgba(0,0,0,.65),inset 0 .4cqw 0 rgba(255,255,255,.15),inset 0 -.8cqw 0 rgba(0,0,0,.4)}
.d-tt::before{content:'';position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(92deg,rgba(255,255,255,.035) 0 .6cqw,transparent .6cqw 1.7cqw);pointer-events:none}
.d-platter{position:absolute;left:5cqw;top:7cqw;width:68cqw;height:68cqw;border-radius:50%;background:#1b1b1d;box-shadow:0 1.4cqw 2.4cqw rgba(0,0,0,.6),inset 0 0 0 1.2cqw #b9bcc2,inset 0 0 0 1.5cqw #6d7076}
.d-rot{position:absolute;inset:0;border-radius:50%}
.d-strobe{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#f0f2f6 0 1.6deg,transparent 1.6deg 6deg);-webkit-mask:radial-gradient(circle,transparent 32.9cqw,#000 33cqw,#000 33.8cqw,transparent 33.9cqw);mask:radial-gradient(circle,transparent 32.9cqw,#000 33cqw,#000 33.8cqw,transparent 33.9cqw)}
.d-vinyl{position:absolute;inset:2.4cqw;border-radius:50%;background:repeating-radial-gradient(circle,#101012 0 .25cqw,#1e1e21 .25cqw .5cqw);box-shadow:inset 0 0 0 .4cqw #000}
.d-label{position:absolute;inset:0;margin:auto;width:21cqw;height:21cqw;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--acc)}
.d-label img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:55% 22%;opacity:.9}
.d-label span{position:relative;margin-top:11cqw;font:800 1.7cqw/1 var(--sans);letter-spacing:.14em;color:#fff;text-shadow:0 1px 3px #000}
.d-sheen{position:absolute;inset:2.4cqw;border-radius:50%;pointer-events:none;background:conic-gradient(from 20deg,transparent 0 30deg,rgba(255,255,255,.17) 45deg,transparent 60deg 200deg,rgba(255,255,255,.12) 225deg,transparent 240deg)}
.d-spindle{position:absolute;left:50%;top:50%;width:2cqw;height:2cqw;margin:-1cqw;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#888)}
.d-arm{position:absolute;left:83cqw;top:5cqw;width:10cqw;height:68cqw;transform-origin:5cqw 5cqw;transform:rotate(var(--arm,0deg));transition:transform 1.2s cubic-bezier(.45,0,.2,1);z-index:3}
.d-pivot{position:absolute;left:0;top:0;width:10cqw;height:10cqw;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f4f5f7,#8b8f96 60%,#3c3f44);box-shadow:0 1cqw 1.6cqw rgba(0,0,0,.6)}
.d-weight{position:absolute;left:2.6cqw;top:-6cqw;width:4.8cqw;height:6cqw;border-radius:1cqw;background:linear-gradient(90deg,#55585e,#c9ccd1,#55585e)}
.d-rod{position:absolute;left:4.4cqw;top:5cqw;width:1.2cqw;height:56cqw;border-radius:1cqw;background:linear-gradient(90deg,#8d9096,#f3f4f6,#9a9da3);box-shadow:.8cqw 1.2cqw 1.4cqw rgba(0,0,0,.45)}
.d-head{position:absolute;left:2.2cqw;top:59cqw;width:5.6cqw;height:8cqw;border-radius:1cqw;background:linear-gradient(#2b2d31,#111);transform:rotate(16deg);box-shadow:.8cqw 1.2cqw 1.4cqw rgba(0,0,0,.5)}
.d-start{position:absolute;left:5cqw;bottom:3.4cqw;width:14cqw;height:6.4cqw;border-radius:1.2cqw;border:0;cursor:pointer;background:linear-gradient(#ecedf0,#a9acb2);box-shadow:0 .7cqw 0 #5c5f65;font:800 1.7cqw/1 var(--sans);letter-spacing:.1em;color:#222;display:flex;align-items:center;justify-content:center;gap:1cqw}
.d-start::before{content:'';width:1.4cqw;height:1.4cqw;border-radius:50%;background:#5a1010}
.playing .d-start::before{background:#ff3b30;box-shadow:0 0 1.6cqw #ff3b30}
.d-start:active{transform:translateY(.5cqw);box-shadow:0 .2cqw 0 #5c5f65}
.d-speed{position:absolute;right:4cqw;bottom:2.6cqw;display:grid;grid-template-columns:repeat(3,9cqw);padding:.8cqw;border-radius:1.6cqw;background:#1a0f08;box-shadow:inset 0 .4cqw .8cqw rgba(0,0,0,.7)}
.d-knob{position:absolute;top:.8cqw;left:.8cqw;bottom:.8cqw;width:9cqw;border-radius:1.1cqw;background:linear-gradient(#f0f1f4,#a7aab0);box-shadow:0 .5cqw .8cqw rgba(0,0,0,.6);transition:transform .35s cubic-bezier(.3,1.4,.5,1);transform:translateX(calc(var(--i,0)*9cqw))}
.d-speed button{position:relative;z-index:1;border:0;background:none;cursor:pointer;padding:.9cqw 0;font:800 2.2cqw/1 var(--sans);color:#d9c7b0;display:grid;gap:.5cqw;justify-items:center}
.d-speed button small{font:600 1.4cqw/1 var(--mono);opacity:.75}
.d-speed button[aria-pressed=true]{color:#1a1a1a}
.d-brand{position:absolute;left:22cqw;bottom:4.8cqw;font:800 1.6cqw/1 var(--mono);letter-spacing:.3em;color:rgba(255,230,200,.45)}
.D .copy{max-width:min(500px,46%)}
@container stage (max-width:520px){
  .d-wrap{left:6%;right:6%;width:auto;top:26px;transform:none}

/* ================= E · Theater marquee ================= */
.e-col{position:absolute;top:24px;right:4%;width:min(46%,500px);z-index:4;display:grid;gap:22px;justify-items:center}
.e-sign{position:relative;width:100%;padding:24px;border-radius:30px 30px 14px 14px;background:linear-gradient(180deg,#B3261E,#6E1410);box-shadow:0 0 0 4px var(--gold),0 0 0 8px #6E1410,0 24px 50px rgba(0,0,0,.6)}
.e-bulbs{position:absolute;inset:9px;pointer-events:none}
.e-bulbs i{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:#6b4a17;box-shadow:inset 0 -2px 3px rgba(0,0,0,.5)}
.e-bulbs i.on{background:#FFF1B8;box-shadow:0 0 6px #FFD24D,0 0 calc(10px + var(--lvl,0)*22px) #FFB800}
.e-bulbs.flash i{background:#fff;box-shadow:0 0 16px #fff}
.e-board{border-radius:10px;padding:14px 12px;background:#0d0d0f;display:grid;gap:9px;justify-items:center;box-shadow:inset 0 2px 12px rgba(0,0,0,.9)}
.e-line{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:26px}
.lt{display:inline-grid;place-items:center;min-width:19px;height:26px;padding:0 3px;background:#F6F1E4;color:#141414;font:900 16px/1 var(--sans);border-radius:2px;box-shadow:0 2px 0 rgba(0,0,0,.5);transform:rotate(var(--r,0deg))}
.lt.sp{background:none;box-shadow:none;min-width:9px}
.e-line.b{min-height:40px}
.e-line.b .lt{height:40px;min-width:28px;font-size:27px}
.lt.out{animation:ltOut .42s cubic-bezier(.5,0,.8,.6) forwards}
.lt.in{animation:ltIn .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes ltOut{to{transform:translateY(50px) rotate(var(--fr,25deg));opacity:0}}
@keyframes ltIn{from{transform:translateY(-36px) rotate(-8deg);opacity:0}}
.e-under{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.e-ticket{display:flex;align-items:stretch;cursor:pointer;border:0;padding:0;background:none;filter:drop-shadow(0 12px 18px rgba(0,0,0,.55));transform:rotate(-2deg);transition:transform .2s}
.e-ticket:hover{transform:rotate(0) scale(1.03)}
.e-stub{display:grid;place-items:center;width:58px;background:var(--gold);color:#6E1410;font-size:20px;border-radius:8px 0 0 8px;border-right:2px dashed #6E1410}
.e-tk{display:grid;align-content:center;gap:4px;padding:10px 22px;background:#C9302C;color:#FFF6DC;border-radius:0 8px 8px 0;text-align:left}
.e-tk small{font:800 10px/1 var(--mono);letter-spacing:.3em;color:#F6D58E}
.e-tk b{font:900 19px/1.15 var(--sans);letter-spacing:.06em}
.e-tiles{display:flex;gap:8px}
.e-tile{min-width:50px;height:50px;border-radius:6px;cursor:pointer;border:0;background:#F6F1E4;color:#141414;font:900 19px/1 var(--sans);box-shadow:0 4px 0 #8c8370;transition:transform .2s,box-shadow .2s}
.e-tile[aria-pressed=true]{background:#FFD24D;box-shadow:0 4px 0 #a07a00,0 0 24px rgba(255,210,77,.75);transform:translateY(-3px)}
@container stage (max-width:520px){
  .e-col{left:14px;right:14px;width:auto;top:16px;gap:16px}
  .e-sign{padding:18px}
  .lt{min-width:14px;height:21px;font-size:13px}
  .e-line.b{min-height:30px}
  .e-line.b .lt{height:30px;min-width:20px;font-size:19px}
  .e-tk{padding:8px 14px}.e-tk b{font-size:15px}.e-stub{width:46px}
  .e-tile{min-width:42px;height:42px;font-size:16px}
}

/* ================= F · Light-show equalizer ================= */
.F .shade{background:linear-gradient(90deg,rgba(4,7,10,.8),rgba(4,7,10,.3) 50%,transparent 80%),linear-gradient(180deg,transparent 45%,rgba(4,7,10,.92))}
.F .copy{bottom:auto;top:52px}
.f-glow{position:absolute;left:-10%;right:-10%;bottom:-30%;height:80%;z-index:1;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 100%,rgba(57,179,106,.8),rgba(143,227,174,.25) 40%,transparent 70%);opacity:calc(.12 + var(--lvl,0)*.88)}
.f-eq{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:2;pointer-events:none;-webkit-mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.f-bars{position:absolute;left:3%;right:3%;top:0;height:78%;display:flex;align-items:flex-end;gap:4px}
.f-bars i{flex:1;height:100%;border-radius:4px 4px 1px 1px;transform-origin:bottom;transform:scaleY(.05);background:linear-gradient(0deg,#39B36A,#8FE3AE 55%,#F3E3A0);box-shadow:0 0 12px rgba(143,227,174,.45)}
.f-bars.f-ref{top:78%;align-items:flex-start;opacity:.22;-webkit-mask:linear-gradient(180deg,#000,transparent 35%);mask:linear-gradient(180deg,#000,transparent 35%)}
.f-ref i{transform-origin:top;background:linear-gradient(180deg,#39B36A,#8FE3AE 55%,#F3E3A0)}
.f-player{position:absolute;right:44px;bottom:calc(34% + 20px);z-index:4;display:flex;flex-direction:row-reverse;align-items:center;gap:18px;text-align:right}
.f-orb{position:relative;flex:none;width:96px;height:96px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 40% 35%,#c9f5d8,#39B36A 60%,#1d6b3d);color:#05210f;font-size:26px;box-shadow:0 0 0 6px rgba(57,179,106,.18),0 0 calc(20px + var(--lvl,0)*60px) rgba(143,227,174,.85);transform:scale(calc(1 + var(--lvl,0)*.07))}
.f-orb svg{position:absolute;inset:-12px;width:120px;height:120px;transform:rotate(-90deg);pointer-events:none}
.f-orb .trk{fill:none;stroke:rgba(255,255,255,.16);stroke-width:2.4}
.f-orb .prg{fill:none;stroke:#F3E3A0;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:289}
.f-meta b{display:block;font:900 28px/1.05 var(--serif);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.f-meta small{display:block;font:600 12px/1.5 var(--sans);color:#dfe6df}
.f-time{font:700 12px/1 var(--mono);color:var(--mint)}
.f-goo{--seg:96px;position:absolute;top:22px;right:22px;z-index:5;width:calc(var(--seg)*3 + 12px);height:52px}
.f-track{position:absolute;inset:0;border-radius:999px;background:rgba(8,10,14,.6);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px)}
.f-goo-fx{position:absolute;inset:0;filter:url(#goo)}
.f-blob,.f-blob2{position:absolute;left:6px;top:6px;width:var(--seg);height:40px;border-radius:999px;background:var(--mint);transform:translateX(calc(var(--i,0)*var(--seg)))}
.f-blob{transition:transform .5s cubic-bezier(.5,1.7,.45,1)}
.f-blob2{left:20px;top:12px;width:calc(var(--seg) - 28px);height:28px;transition:transform .9s cubic-bezier(.3,1.2,.4,1)}
.f-goo-btns{position:absolute;inset:6px;display:grid;grid-template-columns:repeat(3,1fr)}
.f-goo-btns button{display:flex;align-items:center;justify-content:center;gap:7px;border:0;background:none;color:#fff;font:800 13px/1 var(--sans);letter-spacing:.06em;cursor:pointer;transition:color .3s}
.f-goo-btns button[aria-pressed=true]{color:#06210f}
@container stage (max-width:520px){
  .F .shade{background:linear-gradient(180deg,rgba(4,7,10,.6),rgba(4,7,10,.2) 40%,rgba(4,7,10,.92) 75%)}
  .F .copy{top:92px}
  .f-goo{--seg:104px;left:50%;right:auto;top:16px;transform:translateX(-50%)}
  .f-player{left:20px;right:20px;bottom:calc(34% + 14px);flex-direction:row;text-align:left}
  .f-orb{width:78px;height:78px;font-size:22px}
  .f-orb svg{inset:-10px;width:98px;height:98px}
  .f-meta b{font-size:24px}
  .f-bars{gap:3px}
  .f-bars i:nth-child(even){display:none}
}

/* ================= G · Pixie dust ================= */
.g-bubs{position:absolute;top:26px;right:30px;z-index:5;width:340px;height:200px}
.g-bub{position:absolute;padding:13px 18px 11px;border-radius:24px;cursor:pointer;color:#fff;font:800 21px/1 var(--serif);background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(10px);animation:bob 4s ease-in-out infinite;display:grid;gap:5px;text-align:left;box-shadow:0 10px 26px rgba(0,0,0,.25);transition:background .3s,color .3s,box-shadow .3s}

.g-bub::after{content:'';position:absolute;left:18px;bottom:-12px;width:10px;height:10px;border-radius:50%;background:inherit;border:inherit}
.g-bub[aria-pressed=true]{background:rgba(255,238,175,.94);color:#3a2500;border-color:#FFE7A0;box-shadow:0 0 0 3px rgba(255,231,160,.35),0 0 44px rgba(255,214,120,.75)}
.g-en{left:0;top:40px}.g-es{left:140px;top:0;animation-delay:-1.3s}.g-fr{left:180px;top:112px;animation-delay:-2.6s}

.g-wand{position:absolute;right:30px;bottom:30px;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 24px 10px 12px;border-radius:999px;cursor:pointer;color:#fff;text-align:left;background:rgba(22,12,46,.62);border:1px solid rgba(255,230,160,.55);backdrop-filter:blur(10px);transition:box-shadow .4s}
.g-wsvg{width:90px;height:32px;overflow:visible;flex:none}
.g-star{transform-box:fill-box;transform-origin:center;animation:twk 1.6s ease-in-out infinite}
@keyframes twk{50%{transform:scale(1.25) rotate(20deg)}}
.g-wand b{display:block;font:800 16px/1.2 var(--sans)}
.g-wand small{font:600 11.5px/1 var(--sans);color:#FFE7A0}
.playing .g-wand{box-shadow:0 0 34px rgba(255,214,120,.5)}
.copy.g-rev .ttl{animation:rev .8s ease both}
@keyframes rev{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@container stage (max-width:520px){
  .g-bubs{left:0;right:0;top:16px;width:auto;height:auto;display:flex;justify-content:center;gap:10px}

  .g-wand{left:16px;right:16px;bottom:18px}
  .G .copy{bottom:118px}
}

/* ================= H · Mixtape ================= */
.h-rig{position:absolute;right:4%;top:50%;transform:translateY(-50%);width:min(42%,440px);z-index:4;container-type:inline-size;display:grid;gap:5cqw}
.h-tape{position:relative;aspect-ratio:1.58;border-radius:4cqw;background:linear-gradient(160deg,rgba(44,48,56,.94),rgba(14,16,20,.96));border:1px solid rgba(255,255,255,.14);box-shadow:0 5cqw 9cqw rgba(0,0,0,.55),inset 0 .5cqw 0 rgba(255,255,255,.08);transform:rotate(-4deg)}
.h-screw{position:absolute;width:2.6cqw;height:2.6cqw;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ddd,#555)}
.h-label{position:absolute;left:5cqw;right:5cqw;top:4cqw;height:46cqw;border-radius:2cqw;background:linear-gradient(180deg,#f7f1e1 0 64%,var(--gold) 64% 71%,var(--acc) 71% 78%,#f7f1e1 78%)}
.h-label::before{content:'';position:absolute;left:4cqw;right:4cqw;top:3cqw;height:10cqw;background:repeating-linear-gradient(180deg,transparent 0 4.6cqw,rgba(31,42,107,.22) 4.6cqw 4.8cqw)}
.h-hand{position:absolute;left:8cqw;right:8cqw;top:4.6cqw;font:700 4.8cqw/1.1 var(--hand);color:#1f2a6b;transform:rotate(-1.5deg);white-space:nowrap}
.h-side{position:absolute;left:8cqw;right:8cqw;top:39cqw;font:700 2.9cqw/1 var(--hand);color:#1f2a6b;white-space:nowrap;overflow:hidden}
.h-window{position:absolute;left:14cqw;right:14cqw;top:17cqw;height:20cqw;border-radius:10cqw;overflow:hidden;background:rgba(18,18,22,.9);box-shadow:inset 0 0 0 .5cqw #0a0a0c,inset 0 1cqw 2cqw rgba(0,0,0,.7)}
.h-pack{position:absolute;top:50%;left:var(--cx);width:calc(var(--r)*2);height:calc(var(--r)*2);margin:calc(var(--r)*-1);border-radius:50%;background:radial-gradient(circle,#4a2c19 55%,#2a170c)}
.h-hub{position:absolute;top:50%;left:var(--cx);width:8cqw;height:8cqw;margin:-4cqw;border-radius:50%;background:radial-gradient(circle,#1a1a1a 0 1.3cqw,transparent 1.4cqw),repeating-conic-gradient(#f4f4f4 0 40deg,#a9a9a9 40deg 60deg);box-shadow:0 0 0 .6cqw #e8e8e8}
.h-head{position:absolute;left:24cqw;right:24cqw;bottom:0;height:11cqw;background:linear-gradient(#30333a,#1d1f24);clip-path:polygon(9% 0,91% 0,100% 100%,0 100%)}
.h-deck{display:grid;gap:3cqw;padding:3.4cqw;border-radius:3.4cqw;background:linear-gradient(180deg,#2c2f35,#17191d);border:1px solid rgba(255,255,255,.1);box-shadow:0 4cqw 8cqw rgba(0,0,0,.5)}
.h-r1{display:flex;align-items:center;gap:3cqw}
.h-vu{width:24cqw;height:14cqw;border-radius:1.6cqw;background:linear-gradient(#F6E7B9,#E3CD8C);box-shadow:inset 0 0 0 .4cqw #111;flex:none}
.h-vu svg{width:100%;height:100%;display:block}
.h-count{display:flex;gap:.6cqw;padding:1cqw;border-radius:1cqw;background:#050505;flex:none}
.h-dg{width:4.4cqw;height:6.6cqw;overflow:hidden;background:#141414;border-radius:.6cqw}
.h-dg b{display:grid;font:800 4.4cqw/6.6cqw var(--mono);color:#F3E3A0;text-align:center;transition:transform .35s}
.h-keys{display:flex;gap:1.4cqw;margin-left:auto}
.h-key{width:9cqw;height:11cqw;border-radius:1cqw 1cqw 2cqw 2cqw;border:0;cursor:pointer;background:linear-gradient(180deg,#f2f3f5,#b9bcc2);color:#222;font:800 3.2cqw/1 var(--sans);box-shadow:0 1.4cqw 0 #6b6e74,0 1.8cqw 1.4cqw rgba(0,0,0,.5);transition:transform .08s,box-shadow .08s}
.h-key[aria-pressed=true],.h-key:active{transform:translateY(1.1cqw);box-shadow:0 .3cqw 0 #6b6e74;background:linear-gradient(#cfd2d7,#9da0a6)}
.h-r2{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw}
.h-lk{width:auto;height:9cqw;display:flex;align-items:center;justify-content:center;gap:1.6cqw;font-size:3cqw;background:linear-gradient(180deg,#f7e4a6,#cbb26a);box-shadow:0 1.4cqw 0 #7d6a2f,0 1.8cqw 1.4cqw rgba(0,0,0,.5)}
.h-lk[aria-pressed=true]{background:linear-gradient(#e2c97c,#b0954b);box-shadow:0 .3cqw 0 #7d6a2f}
.H .copy{max-width:min(520px,48%)}
@container stage (max-width:520px){
  .h-rig{left:16px;right:16px;width:auto;top:22px;transform:none}
  .H .copy{max-width:none}
}

/* ================= I · Holographic ticket ================= */
.i-scene{perspective:1600px}
.I.hero{--sx:74%;transition:transform .2s ease-out;
  -webkit-mask:radial-gradient(circle 18px at var(--sx) 0,transparent 97%,#000 100%) top/100% 51% no-repeat,radial-gradient(circle 18px at var(--sx) 100%,transparent 97%,#000 100%) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 18px at var(--sx) 0,transparent 97%,#000 100%) top/100% 51% no-repeat,radial-gradient(circle 18px at var(--sx) 100%,transparent 97%,#000 100%) bottom/100% 51% no-repeat}
.i-holo{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:color-dodge;opacity:calc(.3 + var(--lvl,0)*.55);background:linear-gradient(115deg,transparent 20%,rgba(255,0,170,.55) 36%,rgba(0,255,230,.5) 46%,rgba(255,240,0,.5) 56%,rgba(120,80,255,.5) 66%,transparent 80%);background-size:260% 260%;background-position:var(--hx,50%) var(--hy,50%)}
.i-glare{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:overlay;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.45),transparent 45%)}
.i-perf{position:absolute;top:22px;bottom:22px;left:var(--sx);width:0;border-left:3px dotted rgba(255,255,255,.6);z-index:5}
.i-stub{position:absolute;top:0;bottom:0;right:0;left:var(--sx);z-index:4;padding:36px 22px 30px;display:grid;align-content:space-between;justify-items:center;text-align:center;color:#fff;background:linear-gradient(160deg,rgba(14,22,48,.93),rgba(34,12,52,.93)),repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 6px,transparent 6px 12px)}
.i-adm{font:800 10px/1.4 var(--mono);letter-spacing:.32em;color:var(--gold)}
.i-big{display:block;font:900 66px/1 var(--serif);background:linear-gradient(120deg,#FFE7A0,#fff,#C9A227,#FFF4D2);-webkit-background-clip:text;background-clip:text;color:transparent}
.i-play{width:88px;height:88px;border-radius:50%;cursor:pointer;border:0;font-size:26px;color:#1d1300;background:conic-gradient(from var(--ang),#FFE7A0,#C9A227,#fff6d8,#b8892b,#FFE7A0);animation:angspin 4s linear infinite;box-shadow:0 0 0 4px rgba(255,231,160,.25),0 12px 30px rgba(0,0,0,.5),0 0 calc(var(--lvl,0)*55px) rgba(255,220,140,.85)}
@keyframes angspin{to{--ang:360deg}}
.i-song{font:800 19px/1.2 var(--serif)}
.i-song small{display:block;font:600 11px/1.4 var(--sans);color:#c8c3d8}
.i-tabs{display:flex;gap:8px}
.i-tab{position:relative;width:60px;padding:9px 0 8px;border-radius:10px;cursor:pointer;display:grid;justify-items:center;gap:5px;color:#fff;font:800 12px/1 var(--sans);background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.4)}
.i-hole{position:absolute;top:-7px;right:-7px;width:17px;height:17px;border-radius:50%;background:#05070A;box-shadow:inset 0 2px 3px rgba(0,0,0,.9),0 0 0 2px var(--gold);transform:scale(0);transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.i-tab[aria-pressed=true]{border-style:solid;border-color:var(--gold);background:rgba(233,196,106,.16)}
.i-tab[aria-pressed=true] .i-hole{transform:scale(1)}
.i-dot{position:absolute;top:-6px;right:-6px;width:15px;height:15px;border-radius:50%;background:#f3ead2;animation:dropDot .8s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
@keyframes dropDot{to{transform:translate(18px,120px) rotate(200deg);opacity:0}}
.i-serial{font:700 9.5px/1 var(--mono);letter-spacing:.2em;color:rgba(255,255,255,.45)}
.I .copy{max-width:calc(var(--sx) - 100px)}
@container stage (max-width:520px){
  .I.hero{--sy:64%;
    -webkit-mask:radial-gradient(circle 18px at 0 var(--sy),transparent 97%,#000 100%) left/51% 100% no-repeat,radial-gradient(circle 18px at 100% var(--sy),transparent 97%,#000 100%) right/51% 100% no-repeat;
    mask:radial-gradient(circle 18px at 0 var(--sy),transparent 97%,#000 100%) left/51% 100% no-repeat,radial-gradient(circle 18px at 100% var(--sy),transparent 97%,#000 100%) right/51% 100% no-repeat}
  .i-perf{left:22px;right:22px;top:var(--sy);bottom:auto;width:auto;border-left:0;border-top:3px dotted rgba(255,255,255,.6)}
  .i-stub{left:0;top:var(--sy);padding:22px 18px 18px;grid-template-columns:auto 1fr;grid-template-areas:"play song" "tabs tabs" "ser ser";align-content:start;gap:16px 16px;justify-items:start;text-align:left}
  .i-play{grid-area:play;width:72px;height:72px}
  .i-head{display:none}
  .i-song{grid-area:song;align-self:center}
  .i-tabs{grid-area:tabs;justify-self:stretch;justify-content:space-between}

  .i-serial{grid-area:ser}
  .I .copy{bottom:calc(36% + 22px);max-width:none}

/* ================= J · Castle light show ================= */
.J{--wc:#FF4FA3;transition:--wc .45s}

.j-wash{position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:color;background:radial-gradient(ellipse 34% 62% at var(--cx,55%) 48%,var(--wc),transparent 75%);opacity:0;transition:opacity 1.4s}

/* point on the hero photo (fractions of the source image) -> px inside the hero */
function imgPoint(img, fx, fy) {
  const r = img.getBoundingClientRect(), nw = img.naturalWidth || 1400, nh = img.naturalHeight || 934;
  const s = Math.max(r.width / nw, r.height / nh), w = nw * s, h = nh * s;
  const [px, py] = getComputedStyle(img).objectPosition.split(' ').map(v => parseFloat(v) / 100);
  return {x: (r.width - w) * px + fx * w, y: (r.height - h) * py + fy * h};
}
const relTo = (el, host) => { const a = el.getBoundingClientRect(), b = host.getBoundingClientRect(); return {x: a.left - b.left + a.width / 2, y: a.top - b.top + a.height / 2, a, b}; };
const starPts = (cx, cy, R, r) => Array.from({length: 10}, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, d = i % 2 ? r : R; return `${(cx + Math.cos(a) * d).toFixed(1)},${(cy + Math.sin(a) * d).toFixed(1)}`; }).join(' ');
const rnd = arr => arr[Math.random() * arr.length | 0];

/* ---------- canvas particles (fireworks, pixie dust) ---------- */
function particles(cv) {
  const ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  let P = [], W = 1, H = 1;
  const fit = () => { W = cv.clientWidth || 1; H = cv.clientHeight || 1; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  fit();
  const ro = new ResizeObserver(fit); ro.observe(cv);
  const api = {
    get W() { return W; }, get H() { return H; },
    add(p) { if (P.length < 3000) P.push({age: 0, gravity: 0, drag: 1, size: 2, twinkle: false, ...p}); },
    burst(x, y, o = {}) {
      const {n = 70, color = '#fff', speed = 3, life = 70, size = 2, gravity = .04, drag = .985, star = false} = o;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * 6.283, s = speed * (.3 + Math.random() * .8);
        api.add({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (.6 + Math.random() * .6), color: typeof color === 'function' ? color() : color, size: size * (.6 + Math.random() * .7), gravity, drag, twinkle: true, star: star && Math.random() < .5});
      }
    },
    step() {
      ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, W, H); ctx.globalCompositeOperation = 'lighter';
      const dead = [], born = [];
      P = P.filter(p => { if (++p.age < p.life) return true; dead.push(p); return false; });
      for (const p of P) {
        p.vx *= p.drag; p.vy = p.vy * p.drag + p.gravity; p.x += p.vx; p.y += p.vy;
        if (p.trail) born.push({x: p.x, y: p.y, vx: (Math.random() - .5) * .4, vy: Math.random() * .6, life: 22, color: '#FFC977', size: 1.3, gravity: .01, drag: .96});
        const k = 1 - p.age / p.life;
        let a = Math.min(1, k * 1.6);
        if (p.twinkle && k < .5 && Math.random() < .35) a *= .15;
        const r = p.size * (.4 + .6 * k);
        ctx.globalAlpha = a; ctx.fillStyle = p.color;
        if (p.star) { ctx.fillRect(p.x - r * 3, p.y - r * .3, r * 6, r * .6); ctx.fillRect(p.x - r * .3, p.y - r * 3, r * .6, r * 6); }
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283); ctx.fill();
      }
      born.forEach(api.add);
      dead.forEach(p => p.onDie && p.onDie(p));
      ctx.globalAlpha = 1;
    },
    destroy() { ro.disconnect(); P = []; },
  };
  return api;
}

/* ---------- little mechanical sounds (split-flap clack, key thunk) ---------- */
let AC = null, lastClack = 0, sfxWarned = false;
function sfx(type) {
  try {
    if (type === 'clack') { const now = performance.now(); if (now - lastClack < 28) return; lastClack = now; }
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    if (type === 'thunk') {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(55, t + .09);
      g.gain.setValueAtTime(.22, t); g.gain.exponentialRampToValueAtTime(.001, t + .12);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + .13);
    }
    const len = Math.round(AC.sampleRate * .018), b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = b; f.type = 'bandpass'; f.frequency.value = 2300 + Math.random() * 900; f.Q.value = 1.2; g.gain.value = type === 'thunk' ? .2 : .1;
    src.connect(f).connect(g).connect(AC.destination); src.start(t);
  } catch (e) { if (!sfxWarned) { console.warn('sfx unavailable', e); sfxWarned = true; } }
}
let fadeTimer = null;
function fadeVol(to, ms, done) {
  clearInterval(fadeTimer);
  const from = audio.volume, t0 = performance.now();
  fadeTimer = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    audio.volume = from + (to - from) * k;
    if (k >= 1) { clearInterval(fadeTimer); fadeTimer = null; if (done) done(); }
  }, 30);
}
const playAudio = () => audio.play().catch(e => console.warn('play blocked', e));

/* ---------- split-flap helpers (B) ---------- */
const FLAPSET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const LOWER = 'abcdefghijklmnopqrstuvwxyz';
const cells = n => '<span class="fl"><b> </b></span>'.repeat(n);
function flipCell(cell, b, ch, delay) {
  const tok = (cell._tok || 0) + 1; cell._tok = tok;
  let k = 2 + (Math.random() * 5 | 0);
  const go = () => {
    if (cell._tok !== tok) return;
    cell.classList.remove('go'); void cell.offsetWidth; cell.classList.add('go');
    b.textContent = k-- > 0 ? rnd(FLAPSET) : ch;
    sfx('clack');
    if (k >= 0) setTimeout(go, 55);
  };
  setTimeout(go, delay);
}
function setCells(el, text, instant) {
  const cs = [...el.children], s = text.toUpperCase().padEnd(cs.length, ' ').slice(0, cs.length);
  cs.forEach((c, i) => { const b = c.firstChild; if (b.textContent === s[i]) return; if (instant) b.textContent = s[i]; else flipCell(c, b, s[i], i * 28); });
}
function flipLetters(el, text, set, instant) {
  const chars = [...text].map(c => c === ' ' ? ' ' : c), old = $$('span', el);
  if (instant || !old.length) { el.innerHTML = chars.map(c => `<span>${c}</span>`).join(''); return; }
  const n = Math.max(chars.length, old.length);
  for (let i = old.length; i < n; i++) el.insertAdjacentHTML('beforeend', '<span></span>');
  $$('span', el).forEach((s, i) => {
    const target = chars[i] || '';
    if (s.textContent === target) return;
    const tok = (s._tok || 0) + 1; s._tok = tok;
    let k = 2 + (Math.random() * 4 | 0);
    const go = () => {
      if (s._tok !== tok) return;
      s.classList.remove('go'); void s.offsetWidth; s.classList.add('go');
      s.textContent = k-- > 0 ? rnd(set) : target;
      sfx('clack');
      if (k >= 0) setTimeout(go, 60);
    };
    setTimeout(go, i * 34);
  });
}
/* marquee letters (E) */
const tiles = text => [...text.toUpperCase()].map(c => c === ' ' ? '<span class="lt sp"></span>' : `<span class="lt" style="--r:${(Math.random() * 5 - 2.5).toFixed(1)}deg">${c}</span>`).join('');
function swapLine(el, text) {
  const old = $$('.lt', el);
  old.forEach((t, i) => { t.style.setProperty('--fr', `${(Math.random() * 70 - 35).toFixed(0)}deg`); t.style.animationDelay = `${i * 22}ms`; t.classList.add('out'); });
  setTimeout(() => {
    el.innerHTML = tiles(text);
    $$('.lt', el).forEach((t, i) => { t.style.animationDelay = `${i * 32}ms`; t.classList.add('in'); });
  }, 300 + old.length * 22);
}

/* ================= runtime ================= */
function syncSong() {
  const on = !audio.paused;
  stage.classList.toggle('playing', on);
  $$('[data-song]', stage).forEach(b => { b.setAttribute('aria-pressed', String(on)); const i = $('.ic', b); if (i) i.textContent = on ? '❚❚' : '▶'; });
}
function mount(i) {

  S.idx = (i + OPTS.length) % OPTS.length;
  const o = OPTS[S.idx];
  S.cur = o.mount(stage) || {};
  paint(stage);
  syncSong();
  if (S.cur.play && !audio.paused) S.cur.play(true);
  $('#o-let').textContent = o.id.toUpperCase();
  $('#o-name').textContent = o.name;
  $('#o-badge').textContent = o.badge;
  $('#o-pitch').innerHTML = o.pitch;
  $('#o-real').innerHTML = o.real;
  $$('#pick button').forEach((b, j) => b.setAttribute('aria-current', String(j === S.idx)));
  $$('#pick button')[S.idx].scrollIntoView({block: 'nearest', inline: 'center'});
  history.replaceState(null, '', `#${o.id}`);
}
function setLang(c) {
  if (c === S.lang) return;
  S.lang = c;
  $$('[data-lang]', stage).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === c)));
  if (S.cur.lang) S.cur.lang(c); else swapText(stage);
}
stage.addEventListener('click', e => {
  const s = e.target.closest('[data-song]');
  if (s) { if (S.cur.song) S.cur.song(); else if (audio.paused) playAudio(); else audio.pause(); return; }
  const l = e.target.closest('[data-lang]');
  if (l) setLang(l.dataset.lang);
});
audio.addEventListener('play', () => { syncSong(); if (S.cur.play) S.cur.play(true); });
audio.addEventListener('pause', () => { syncSong(); if (S.cur.play) S.cur.play(false); });

let lvl = 0, lastF = -1;
(function frame() {
  const f = Math.floor(audio.currentTime * 20), target = audio.paused ? 0 : (ENVN[f] || 0);
  lvl += (target - lvl) * (target > lvl ? .5 : .12);
  if (!audio.paused && f !== lastF) {
    if (lastF >= 0 && f > lastF && f - lastF < 10) for (let i = lastF + 1; i <= f; i++) if (PEAKSET.has(i) && S.cur.beat) S.cur.beat();
    lastF = f;
  }
  stage.style.setProperty('--lvl', lvl.toFixed(3));
  if (S.cur.tick) S.cur.tick(lvl, performance.now() / 1000);
  requestAnimationFrame(frame);
})();

$('#pick').innerHTML = OPTS.map((o, i) => `<button type="button" data-i="${i}"><b>${o.id.toUpperCase()}</b>${o.name}</button>`).join('');
$('#pick').addEventListener('click', e => { const b = e.target.closest('button'); if (b) mount(+b.dataset.i); });
$('#prev').addEventListener('click', () => mount(S.idx - 1));
$('#next').addEventListener('click', () => mount(S.idx + 1));
$$('[data-view]').forEach(b => b.addEventListener('click', () => {
  S.view = b.dataset.view;
  $$('[data-view]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  $('#device').classList.toggle('phone', S.view === 'phone');
  mount(S.idx);
}));
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') mount(S.idx + 1);
  else if (e.key === 'ArrowLeft') mount(S.idx - 1);
  else { const k = OPTS.findIndex(o => o.id === e.key.toLowerCase()); if (k >= 0 && !e.ctrlKey && !e.metaKey && !e.altKey) mount(k); }
});
mount(Math.max(0, OPTS.findIndex(o => `#${o.id}` === location.hash)));
</script>
</body>
